name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: mvn --batch-mode -DskipTests package

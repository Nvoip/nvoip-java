name: Publish package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to Maven Central after validation
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  maven-central:
    name: Publish to Maven Central
    runs-on:
      - codebuild-nvoip-ci-public-release-${{ github.run_id }}-${{ github.run_attempt }}
      - organization-registration-name:Nvoip
      - registration-group-id:4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - if: github.event_name != 'release' && !inputs.publish
        run: mvn --batch-mode verify
      - if: github.event_name == 'release' || inputs.publish
        run: mvn --batch-mode deploy -P release
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
